name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-policy:
    name: Release policy
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate the pull request title
        env:
          SMALL_OS_PR_TITLE: ${{ github.event.pull_request.title }}
        run: python tools/release_policy.py

  typing:
    name: Static typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: pyright

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report
      - run: coverage xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  package:
    name: Build and verify distribution
    needs: [typing, test, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - name: Smoke-test the installed wheel outside the checkout
        working-directory: /tmp
        run: >-
          python -c "from SmallPackage import SmallOS, SmallOSConfig, SmallTask, Unix;
          assert SmallOS(config=SmallOSConfig()).setKernel(Unix())"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
