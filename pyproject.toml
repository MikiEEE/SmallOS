[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "SmallPackage"
dynamic = ["version"]
description = "Concurrent and priority-oriented task management system"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael E" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pyright>=1.1.390",
]

[project.urls]
Documentation = "https://github.com/MikiEEE/SmallOS"
Source = "https://github.com/MikiEEE/SmallOS"
Issues = "https://github.com/MikiEEE/SmallOS/issues"

[tool.setuptools.packages.find]
include = ["SmallPackage*"]

[tool.setuptools.package-data]
SmallPackage = ["py.typed"]
"SmallPackage.clients" = ["README.md"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["SmallPackage", "demos"]
exclude = ["build", "dist"]
ignore = [
    "SmallPackage/Kernel.py",
    "SmallPackage/SmallSignals.py",
    "SmallPackage/clients",
    "SmallPackage/shells.py",
    "demos",
]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false
reportMissingImports = false
